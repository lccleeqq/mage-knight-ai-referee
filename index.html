<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mage Knight AI 裁判 v3.3</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div class="badge">RULES ENGINE v3.3 · COMBAT STATE</div><h1>⚔ Mage Knight AI 裁判</h1><p>只判斷規則；不替玩家決策。</p></header><section class="panel"><h2>① 遊戲狀態</h2><div class="grid"><label>Round<input id="round" type="number" value="1"></label><label>時間<select id="time"><option>Day</option><option>Night</option></select></label><label>Phase<select id="phase"><option value="unknown">未提供</option><option>Attack</option><option>Block</option><option>Movement</option><option>Interaction</option><option>Ranged/Siege</option><option>End of Turn</option></select></label><label>敵人<input id="enemy" placeholder="例如 Orc"></label><label>Attack<input id="attack" type="number" placeholder="例如 5"></label><label>Enemy Defense<input id="enemyDefense" type="number" placeholder="例如 3"></label></div></section><section class="panel"><h2>② 描述行動</h2><textarea id="action" placeholder="例如：我用 5 點攻擊力攻擊 Orc，Orc 有 3 點防禦。"></textarea><div class="controls"><button id="checkBtn">⚖ 執行規則判定</button><button id="clearBtn" class="secondary">清除</button></div></section><section id="result" class="result empty">等待判定……</section><section class="panel"><h2>③ Combat State</h2><div id="combatSnapshot">尚未建立戰鬥狀態。</div></section><section class="panel"><h2>④ Rules Engine Regression Test</h2><button id="runRegression">▶ 開始 38 題測試</button><div id="testSummary" class="test-summary" hidden></div><div id="testList" class="test-list"></div></section><footer><small>v3.3 · Combat State Engine</small></footer></main><script src="app.js?v=3.3.1"></script><script>const action=document.getElementById('action'),result=document.getElementById('result');function ui(){return{round:+round.value||1,time:time.value,phase:phase.value,enemy:enemy.value.trim(),attack:attack.value===''?undefined:+attack.value,enemyDefense:enemyDefense.value===''?undefined:+enemyDefense.value,unitState:'unknown'}}function run(){const r=check(action.value,ui());result.className='result '+r.type;result.innerHTML='<div class="verdict">'+(r.title||r.type)+'</div><div>'+r.body+'</div><div class="rule-id">Rule: '+(r.ruleId||'—')+'</div>';if(r.normalized?.action==='attack')document.getElementById('combatSnapshot').innerHTML='Target: '+(r.normalized.entities.enemy||enemy.value||'—')+' · Attack: '+(r.normalized.entities.attack??attack.value??'—')+' · Defense: '+(r.normalized.entities.enemyDefense??enemyDefense.value??'—')+' · Damage: '+(r.normalized.entities.damage??'—')}document.getElementById('checkBtn').onclick=run;document.getElementById('clearBtn').onclick=()=>{action.value='';result.className='result empty';result.textContent='等待判定……'};const REG=[['R-001','我這回合第二次使用已經 Spent 的 Unit。',{unitState:'unknown'},'violation'],['R-002','我再次使用這個 Unit。',{unitState:'unknown'},'insufficient'],['R-003','Concentration 取得 Mana。',{},'ok'],['R-004','我在 Block 階段 Block。',{phase:'Block'},'ok'],['R-005','我在 Attack 階段 Block。',{phase:'Attack'},'violation'],['R-006','我用 Block 防禦敵人的攻擊。',{phase:'unknown'},'insufficient'],['R-007','我攻擊敵人。',{},'insufficient'],['R-008','我要移動到森林。',{},'insufficient'],['R-009','我使用 Unit。',{unitState:'unknown'},'insufficient'],['R-010','我這回合第二次使用已經 Spent 的 Unit',{unitState:'ready'},'violation'],['R-011','',{},'insufficient'],['R-012','這個行動是否合法？',{},'insufficient'],['R-013','這個行動一定合法。',{},'insufficient'],['R-014','我要移動到森林。',{},'insufficient'],['R-015','我要攻擊敵人。',{},'insufficient'],['R-016','晚上我要移動到森林。',{time:'Night'},'insufficient'],['R-017','我使用 Unit。',{unitState:'unknown'},'insufficient'],['R-018','我再次啟動 Unit。',{unitState:'unknown'},'insufficient'],['R-019','我再次啟動已用過的 Unit。',{},'violation'],['R-020','Concentration 取得 魔力。',{},'ok'],['R-021','我在白天移動到森林。',{time:'Day'},'insufficient'],['R-022','我在 Attack 階段 Block。',{phase:'Attack'},'violation'],['R-023','我在 Block 階段 Block。',{phase:'Block'},'ok'],['R-024','我在 Block 階段用 Block 防禦敵人的攻擊。',{phase:'Block'},'ok'],['R-025','attack enemy',{},'insufficient'],['R-026','move to forest',{},'insufficient'],['R-027','use unit again',{},'insufficient'],['R-028','use spent unit again',{},'violation'],['R-029','concentration mana',{},'ok'],['R-030','我不確定這個行動可以嗎？',{},'insufficient'],['R-031','我再次使用這個 Unit。',{unitState:'spent'},'violation'],['R-032','我再次使用這個 Unit。',{unitState:'ready'},'insufficient'],['R-033','我攻擊敵人。',{phase:'Attack'},'insufficient'],['R-034','我移動到森林。',{time:'Night'},'insufficient'],['R-035','未知行動。',{},'insufficient'],['R-036','是否合法',{},'insufficient'],['R-037','我一定合法。',{},'insufficient'],['R-038','Concentration 取得 Mana',{},'ok']];document.getElementById('runRegression').onclick=()=>{let p=0;testList.innerHTML='';REG.forEach(([id,t,s,e])=>{const r=check(t,s),ok=r.type===e;if(ok)p++;testList.innerHTML+=`<div>${ok?'✓':'✗'} ${id} · expected ${e} · got ${r.type} · ${r.ruleId||'-'}</div>`});testSummary.hidden=false;testSummary.textContent=(p===38?'PASS':'FAIL')+' — '+p+'/38 passed';testSummary.className='test-summary '+(p===38?'test-pass':'test-fail')};</script></body></html>
