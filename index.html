<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Mage Knight AI Referee - Rules Engine v1"><title>Mage Knight AI 裁判</title>
<link rel="stylesheet" href="style.css">
</head>
<body><main class="app">
<header><div class="badge">RULES ENGINE v1 · REFEREE ONLY</div><h1>⚔ Mage Knight AI 裁判</h1><p>不提供策略建議；只判斷「違規 / 資訊不足 / 目前沒有發現違規」。</p></header>
<section class="panel">
<h2>① 遊戲狀態</h2>
<div class="grid">
<label>Round<input id="round" type="number" min="1" value="1"></label>
<label>時間<select id="time"><option>Day</option><option>Night</option></select></label>
<label>Unit 狀態<select id="unitState"><option value="unknown">未提供</option><option value="ready">Ready</option><option value="spent">Spent</option><option value="wounded">Wounded</option></select></label>
<label>戰鬥階段<select id="phase"><option value="unknown">未提供</option><option>Movement</option><option>Interaction</option><option>Ranged/Siege</option><option>Block</option><option>Attack</option><option>End of Turn</option></select></label>
</div>
</section>
<section class="panel"><h2>② 描述你的行動</h2><textarea id="action" placeholder="例如：我使用 Concentration 取得 1 個紅色 Mana token，然後用它的強效果搭配 Swiftness。"></textarea>
<div class="controls"><button id="checkBtn">⚖ 執行規則判定</button><button id="clearBtn" class="secondary">清除</button></div>
<div class="examples"><button data-example="我使用 Concentration 取得 1 個紅色 Mana token。">Concentration / Mana</button><button data-example="我的 Unit 已經 Spent，但我這回合再啟動它。">Spent Unit</button><button data-example="我用 Concentration 的強效果搭配 Spell。">Concentration / Spell</button><button data-example="我已經擊敗敵人，直接拿 Fame。">戰鬥結算</button></div></section>
<section id="result" class="result empty">等待判定……</section>
<footer><small>Rules Engine v1 · 未發現錯誤 ≠ 證明合法。規則資料庫必須持續依指定版本規則書與 FAQ 驗證。</small></footer>
</main><script src="app.js"></script></body></html>
