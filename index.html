<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mage Knight AI 裁判 v3.2</title><link rel="stylesheet" href="style.css"><style>.state-log{margin-top:12px;padding:12px;background:#f8fafc;border-radius:10px}.log-row,.unit-row{padding:9px 0;border-bottom:1px solid #e5e7eb;font-family:ui-monospace,monospace;font-size:13px}.unit-row:last-child,.log-row:last-child{border-bottom:0}.test-summary{margin-top:14px;padding:14px;border-radius:10px;font-weight:700}.test-pass{color:#166534;background:#dcfce7}.test-fail{color:#991b1b;background:#fee2e2}.test-list{margin-top:10px;max-height:520px;overflow:auto;font-family:ui-monospace,monospace;font-size:13px}.test-case{padding:9px;border-bottom:1px solid #ddd}.test-case.fail{background:#fff1f2}.test-case.pass{background:#f0fdf4}.state-badge{font-weight:700}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.mini{font-size:12px;opacity:.8}</style></head>
<body><main class="app"><header><div class="badge">RULES ENGINE v3.2 · REFEREE ONLY</div><h1>⚔ Mage Knight AI 裁判</h1><p>不提供策略建議；只判斷違規、資訊不足或目前沒有發現違規。</p></header>
<section class="panel"><h2>① 遊戲狀態</h2><div class="grid"><label>Round<input id="round" type="number" min="1" value="1"></label><label>時間<select id="time"><option>Day</option><option>Night</option></select></label><label>Phase<select id="phase"><option value="unknown">未提供</option><option>Movement</option><option>Interaction</option><option>Ranged/Siege</option><option>Block</option><option>Attack</option><option>End of Turn</option></select></label><label>Move<input id="move" type="number" min="0" value="5"></label><label>Mana<input id="mana" type="number" min="0" value="0"></label><label>Terrain<select id="terrain"><option value="unknown">未提供</option><option value="plains">Plains</option><option value="forest">Forest</option><option value="desert">Desert</option><option value="swamp">Swamp</option></select></label></div></section>
<section class="panel"><h2>② Units</h2><p class="mini">每個 Unit 獨立記錄 Ready / Spent，不互相影響。</p><div id="units"></div><div class="controls"><button id="addUnit">＋ 新增 Unit</button><button id="resetUnits" class="secondary">重設 Units</button></div></section>
<section class="panel"><h2>③ 描述你的行動</h2><label>目前操作 Unit<select id="activeUnit"></select></label><textarea id="action" placeholder="例如：我使用這個 Unit。"></textarea><div class="controls"><button id="checkBtn">⚖ 執行規則判定</button><button id="clearBtn" class="secondary">清除</button><button id="endTurn" class="secondary">⏭ End Turn</button></div></section>
<section id="result" class="result empty">等待判定……</section>
<section class="panel"><h2>④ Action Log</h2><div id="stateSnapshot" class="state-log"></div><div id="actionLog" class="state-log"></div><div class="controls"><button id="undoBtn" class="secondary">↶ 復原上一個狀態</button><button id="resetStateBtn" class="secondary">重設整個狀態</button></div></section>
<section class="panel"><h2>🧪 ⑤ Rules Engine Regression Test</h2><p>38 個正式基準案例 + V3.2 State Engine 測試。</p><button id="runRegression">▶ 開始 38 題測試</button><div id="testSummary" class="test-summary" hidden></div><div id="testList" class="test-list"></div></section>
<footer><small>Rules Engine v3.2 · 「未發現違規」≠「證明合法」。</small></footer></main>
<script src="app.js?v=3.2.0"></script><script>
const units={A:'ready',B:'spent',C:'ready'};let nextUnit=68;let active='A';const history=[],logs=[];
function clone(){return JSON.parse(JSON.stringify({round:+document.getElementById('round').value||1,time:document.getElementById('time').value,phase:document.getElementById('phase').value,move:+document.getElementById('move').value||0,mana:+document.getElementById('mana').value||0,terrain:document.getElementById('terrain').value,units}))}
function apply(s){document.getElementById('round').value=s.round;document.getElementById('time').value=s.time;document.getElementById('phase').value=s.phase;document.getElementById('move').value=s.move;document.getElementById('mana').value=s.mana;document.getElementById('terrain').value=s.terrain;Object.keys(units).forEach(k=>delete units[k]);Object.assign(units,s.units);render()}
function state(){return{round:+document.getElementById('round').value||1,time:document.getElementById('time').value,phase:document.getElementById('phase').value,move:+document.getElementById('move').value||0,mana:+document.getElementById('mana').value||0,terrain:document.getElementById('terrain').value,unitState:units[active]||'unknown'}}
function render(){document.getElementById('units').innerHTML=Object.entries(units).map(([id,st])=>`<div class="unit-row"><b>Unit ${id}</b> <span class="state-badge">${st}</span> <button data-ready="${id}">Ready</button> <button data-spent="${id}">Spent</button> <button data-remove="${id}">×</button></div>`).join('');document.querySelectorAll('[data-ready]').forEach(b=>b.onclick=()=>{units[b.dataset.ready]='ready';render()});document.querySelectorAll('[data-spent]').forEach(b=>b.onclick=()=>{units[b.dataset.spent]='spent';render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{delete units[b.dataset.remove];if(active===b.dataset.remove)active=Object.keys(units)[0]||'';render()});document.getElementById('activeUnit').innerHTML=Object.keys(units).map(k=>`<option value="${k}" ${k===active?'selected':''}>Unit ${k} (${units[k]})</option>`).join('');document.getElementById('activeUnit').value=active;document.getElementById('stateSnapshot').innerHTML=`Round ${document.getElementById('round').value} · ${document.getElementById('time').value} · Phase ${document.getElementById('phase').value}<br>Move ${document.getElementById('move').value} · Mana ${document.getElementById('mana').value} · Terrain ${document.getElementById('terrain').value}<br>${Object.entries(units).map(([k,v])=>`Unit ${k}: <b>${v}</b>`).join(' · ')}`;document.getElementById('actionLog').innerHTML=logs.length?logs.map(x=>`<div class="log-row"><b>#${x.n}</b> ${x.text}<br>${x.change} · ${x.result} · ${x.rule}</div>`).join(''):'尚無行動紀錄。'}
function runAction(){const input=document.getElementById('action').value;const before=clone();const r=check(input,state());const el=document.getElementById('result');el.className='result '+r.type;el.innerHTML=`<div class="verdict">${r.title||r.type}</div><div>${r.body||''}</div><div class="rule-id">Rule: ${r.ruleId||'—'}</div>`;if(r.type==='ok'||r.type==='violation'){history.push(before);if(r.normalized?.action==='use_unit'&&units[active]==='ready'&&r.type==='ok')units[active]='spent';logs.push({n:logs.length+1,text:`Unit ${active}: ${input}`,change:`${before.units[active]||'unknown'} → ${units[active]||'unknown'}`,result:r.type,rule:r.ruleId||'-'});render()}}
document.getElementById('activeUnit').onchange=e=>active=e.target.value;document.getElementById('checkBtn').onclick=runAction;document.getElementById('clearBtn').onclick=()=>{document.getElementById('action').value='';document.getElementById('result').className='result empty';document.getElementById('result').textContent='等待判定……'};document.getElementById('addUnit').onclick=()=>{let id=String.fromCharCode(nextUnit++);units[id]='ready';active=id;render()};document.getElementById('resetUnits').onclick=()=>{Object.keys(units).forEach(k=>delete units[k]);Object.assign(units,{A:'ready',B:'spent',C:'ready'});active='A';render()};document.getElementById('undoBtn').onclick=()=>{const s=history.pop();if(s){apply(s);logs.pop();render()}};document.getElementById('resetStateBtn').onclick=()=>{apply({round:1,time:'Day',phase:'unknown',move:5,mana:0,terrain:'unknown',units:{A:'ready',B:'spent',C:'ready'}});active='A';history.length=0;logs.length=0;render()};document.getElementById('endTurn').onclick=()=>{history.push(clone());const t=document.getElementById('time').value;document.getElementById('time').value=t==='Day'?'Night':'Day';if(t==='Night')document.getElementById('round').value=(+document.getElementById('round').value||1)+1;Object.keys(units).forEach(k=>units[k]='ready');logs.push({n:logs.length+1,text:'End Turn',change:`${t} → ${document.getElementById('time').value}; Units → Ready`,result:'state_update',rule:'TURN_END'});render()};render();
const REGRESSION_CASES=[['R-001','我這回合第二次使用已經 Spent 的 Unit。',{unitState:'unknown'},'violation'],['R-002','我再次使用這個 Unit。',{unitState:'unknown'},'insufficient'],['R-003','Concentration 取得 Mana。',{},'ok'],['R-004','我在 Block 階段 Block。',{phase:'Block'},'ok'],['R-005','我在 Attack 階段 Block。',{phase:'Attack'},'violation'],['R-006','我用 Block 防禦敵人的攻擊。',{phase:'unknown'},'insufficient'],['R-007','我攻擊敵人。',{},'insufficient'],['R-008','我要移動到森林。',{},'insufficient'],['R-009','我使用 Unit。',{unitState:'unknown'},'insufficient'],['R-010','我這回合第二次使用已經 Spent 的 Unit',{unitState:'ready'},'violation'],['R-011','',{},'insufficient'],['R-012','這個行動是否合法？',{},'insufficient'],['R-013','這個行動一定合法。',{},'insufficient'],['R-014','我要移動到森林。',{},'insufficient'],['R-015','我要攻擊敵人。',{},'insufficient'],['R-016','晚上我要移動到森林。',{time:'Night'},'insufficient'],['R-017','我使用 Unit。',{unitState:'unknown'},'insufficient'],['R-018','我再次啟動 Unit。',{unitState:'unknown'},'insufficient'],['R-019','我再次啟動已用過的 Unit。',{},'violation'],['R-020','Concentration 取得 魔力。',{},'ok'],['R-021','我在白天移動到森林。',{time:'Day'},'insufficient'],['R-022','我在 Attack 階段 Block。',{phase:'Attack'},'violation'],['R-023','我在 Block 階段 Block。',{phase:'Block'},'ok'],['R-024','我在 Block 階段用 Block 防禦敵人的攻擊。',{phase:'Block'},'ok'],['R-025','attack enemy',{},'insufficient'],['R-026','move to forest',{},'insufficient'],['R-027','use unit again',{},'insufficient'],['R-028','use spent unit again',{},'violation'],['R-029','concentration mana',{},'ok'],['R-030','我不確定這個行動可以嗎？',{},'insufficient'],['R-031','我再次使用這個 Unit。',{unitState:'spent'},'violation'],['R-032','我再次使用這個 Unit。',{unitState:'ready'},'insufficient'],['R-033','我攻擊敵人。',{phase:'Attack'},'insufficient'],['R-034','我移動到森林。',{time:'Night'},'insufficient'],['R-035','未知行動。',{},'insufficient'],['R-036','是否合法',{},'insufficient'],['R-037','我一定合法。',{},'insufficient'],['R-038','Concentration 取得 Mana',{},'ok']];
function runRegression(){let p=0,f=0;const list=document.getElementById('testList');list.innerHTML='';REGRESSION_CASES.forEach(([id,input,s,e])=>{const r=check(input,s),ok=r.type===e;ok?p++:f++;list.innerHTML+=`<div class="test-case ${ok?'pass':'fail'}"><b>${ok?'✓':'✗'} ${id}</b><br>expected: ${e}<br>got: ${r.type}<br><span class="mini">action: ${r.normalized?.action||'-'} · rule: ${r.ruleId||'-'}</span></div>`});const el=document.getElementById('testSummary');el.hidden=false;el.className='test-summary '+(f?'test-fail':'test-pass');el.textContent=`${f?'FAIL':'PASS'} — ${p}/38 passed`}
document.getElementById('runRegression').onclick=runRegression;
</script></body></html>
