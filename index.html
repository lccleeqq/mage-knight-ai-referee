<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Mage Knight AI Referee - Rules Engine v3.1.1"><title>Mage Knight AI 裁判</title><link rel="stylesheet" href="style.css"><style>.state-log{margin-top:12px;padding:12px;background:#f8fafc;border-radius:10px}.log-row{padding:8px 0;border-bottom:1px solid #e5e7eb;font-family:ui-monospace,monospace;font-size:13px}.log-row:last-child{border-bottom:0}.state-changed{font-weight:700}.test-summary{margin-top:16px;padding:14px;border-radius:10px;font-weight:700}.test-pass{color:#166534;background:#dcfce7}.test-fail{color:#991b1b;background:#fee2e2}.test-list{margin-top:12px;max-height:520px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}.test-case{padding:10px;border-bottom:1px solid #ddd}.test-case.fail{background:#fff1f2}.test-case.pass{background:#f0fdf4}.test-run{margin-top:10px}.test-meta{opacity:.8;margin-top:3px}</style></head>
<body><main class="app"><header><div class="badge">RULES ENGINE v3.1.1 · REFEREE ONLY</div><h1>⚔ Mage Knight AI 裁判</h1><p>不提供策略建議；只判斷「違規 / 資訊不足 / 目前沒有發現違規」。</p></header>
<section class="panel"><h2>① 遊戲狀態</h2><div class="grid"><label>Round<input id="round" type="number" min="1" value="1"></label><label>時間<select id="time"><option>Day</option><option>Night</option></select></label><label>Unit 狀態<select id="unitState"><option value="unknown">未提供</option><option value="ready">Ready</option><option value="spent">Spent</option><option value="wounded">Wounded</option></select></label><label>戰鬥階段<select id="phase"><option value="unknown">未提供</option><option>Movement</option><option>Interaction</option><option>Ranged/Siege</option><option>Block</option><option>Attack</option><option>End of Turn</option></select></label><label>Move<input id="move" type="number" min="0" value="5"></label><label>Mana<input id="mana" type="number" min="0" value="0"></label><label>地形<select id="terrain"><option value="unknown">未提供</option><option value="plains">Plains</option><option value="forest">Forest</option><option value="desert">Desert</option><option value="swamp">Swamp</option></select></label></div></section>
<section class="panel"><h2>② 描述你的行動</h2><textarea id="action" placeholder="例如：我使用這個 Unit。"></textarea><div class="controls"><button id="checkBtn">⚖ 執行規則判定</button><button id="clearBtn" class="secondary">清除</button></div><div class="examples"><button data-example="我使用 Concentration 取得 1 個紅色 Mana token。">Concentration / Mana</button><button data-example="我的 Unit 已經 Spent，但我這回合再啟動它。">Spent Unit</button></div></section>
<section id="result" class="result empty">等待判定……</section>
<section class="panel"><h2>③ Action Log / State Engine</h2><p>每次確認後，系統會保存行動與狀態變化；AI 不替玩家決策。</p><div id="stateSnapshot" class="state-log">尚未記錄行動。</div><div class="controls"><button id="undoBtn" class="secondary">↶ 復原上一個狀態</button><button id="resetStateBtn" class="secondary">重設狀態</button></div><div id="actionLog" class="state-log"></div></section>
<section class="panel"><h2>🧪 ④ Rules Engine Regression Test</h2><p>38 個基準案例，直接呼叫正式 check()。</p><button id="runRegression" class="test-run">▶ 開始 38 題測試</button><div id="testSummary" class="test-summary" hidden></div><div id="testList" class="test-list"></div></section>
<footer><small>Rules Engine v3.1.1 · 「未發現違規」≠「證明合法」。</small></footer></main>
<script src="app.js?v=3.1.1"></script><script>
const history=[];const logs=[];function readUI(){return{round:Number(document.getElementById('round').value)||1,time:document.getElementById('time').value,phase:document.getElementById('phase').value,move:Number(document.getElementById('move').value)||0,mana:Number(document.getElementById('mana').value)||0,terrain:document.getElementById('terrain').value,unitState:document.getElementById('unitState').value}}function applyUI(s){document.getElementById('round').value=s.round;document.getElementById('time').value=s.time;document.getElementById('phase').value=s.phase;document.getElementById('move').value=s.move;document.getElementById('mana').value=s.mana;document.getElementById('terrain').value=s.terrain;document.getElementById('unitState').value=s.unitState||'unknown'}function snapshot(){return JSON.parse(JSON.stringify(readUI()))}function renderState(){const s=readUI();document.getElementById('stateSnapshot').innerHTML=`<div><b>Round</b>: ${s.round} · <b>Time</b>: ${s.time} · <b>Phase</b>: ${s.phase}</div><div><b>Move</b>: ${s.move} · <b>Mana</b>: ${s.mana} · <b>Terrain</b>: ${s.terrain} · <b>Unit</b>: ${s.unitState}</div>`;document.getElementById('actionLog').innerHTML=logs.length?logs.map(x=>`<div class="log-row"><b>#${x.n}</b> ${x.action} → <span class="state-changed">${x.change}</span> · ${x.result}</div>`).join(''):'<div class="log-row">尚無行動紀錄。</div>'}function record(input){const before=snapshot(),r=check(input,before);if(r.type==='violation'||r.type==='ok'){history.push(before);if(r.normalized?.action==='use_unit'&&before.unitState==='ready')document.getElementById('unitState').value='spent';if(r.normalized?.action==='concentration_mana')document.getElementById('mana').value=before.mana+1;const after=readUI();logs.push({n:logs.length+1,action:r.normalized?.action||'unknown',change:before.unitState!==after.unitState?`${before.unitState} → ${after.unitState}`:(before.mana!==after.mana?`Mana ${before.mana} → ${after.mana}`:'狀態未變更'),result:r.type})}renderState()}document.getElementById('checkBtn').addEventListener('click',()=>{const input=document.getElementById('action').value;const r=check(input,readUI());const el=document.getElementById('result');el.className='result '+r.type;el.innerHTML=`<div class="verdict">${r.title||r.type}</div><div>${r.body||''}</div><div class="rule-id">Rule: ${r.ruleId||'—'}</div>`;if(r.type==='violation'||r.type==='ok')record(input)});document.getElementById('undoBtn').addEventListener('click',()=>{const s=history.pop();if(s){applyUI(s);logs.pop();renderState()}});document.getElementById('resetStateBtn').addEventListener('click',()=>{applyUI({round:1,time:'Day',phase:'unknown',move:5,mana:0,terrain:'unknown',unitState:'unknown'});history.length=0;logs.length=0;renderState()});renderState();
const REGRESSION_CASES=[['R-001','我這回合第二次使用已經 Spent 的 Unit。',{unitState:'unknown'},'violation'],['R-002','我再次使用這個 Unit。',{unitState:'unknown'},'insufficient'],['R-003','Concentration 取得 Mana。',{},'ok'],['R-004','我在 Block 階段 Block。',{phase:'Block'},'ok'],['R-005','我在 Attack 階段 Block。',{phase:'Attack'},'violation'],['R-006','我用 Block 防禦敵人的攻擊。',{phase:'unknown'},'insufficient'],['R-007','我攻擊敵人。',{},'insufficient'],['R-008','我要移動到森林。',{},'insufficient'],['R-009','我使用 Unit。',{unitState:'unknown'},'insufficient'],['R-010','我這回合第二次使用已經 Spent 的 Unit',{unitState:'ready'},'violation'],['R-011','',{},'insufficient'],['R-012','這個行動是否合法？',{},'insufficient'],['R-013','這個行動一定合法。',{},'insufficient'],['R-014','我要移動到森林。',{},'insufficient'],['R-015','我要攻擊敵人。',{},'insufficient'],['R-016','晚上我要移動到森林。',{time:'Night'},'insufficient'],['R-017','我使用 Unit。',{unitState:'unknown'},'insufficient'],['R-018','我再次啟動 Unit。',{unitState:'unknown'},'insufficient'],['R-019','我再次啟動已用過的 Unit。',{},'violation'],['R-020','Concentration 取得 魔力。',{},'ok'],['R-021','我在白天移動到森林。',{time:'Day'},'insufficient'],['R-022','我在 Attack 階段 Block。',{phase:'Attack'},'violation'],['R-023','我在 Block 階段 Block。',{phase:'Block'},'ok'],['R-024','我在 Block 階段用 Block 防禦敵人的攻擊。',{phase:'Block'},'ok'],['R-025','attack enemy',{},'insufficient'],['R-026','move to forest',{},'insufficient'],['R-027','use unit again',{},'insufficient'],['R-028','use spent unit again',{},'violation'],['R-029','concentration mana',{},'ok'],['R-030','我不確定這個行動可以嗎？',{},'insufficient'],['R-031','我再次使用這個 Unit。',{unitState:'spent'},'violation'],['R-032','我再次使用這個 Unit。',{unitState:'ready'},'insufficient'],['R-033','我攻擊敵人。',{phase:'Attack'},'insufficient'],['R-034','我移動到森林。',{time:'Night'},'insufficient'],['R-035','未知行動。',{},'insufficient'],['R-036','是否合法',{},'insufficient'],['R-037','我一定合法。',{},'insufficient'],['R-038','Concentration 取得 Mana',{},'ok']];function runRegression(){const summary=document.getElementById('testSummary'),list=document.getElementById('testList');let pass=0,fail=0;list.innerHTML='';REGRESSION_CASES.forEach(([id,input,s,expected])=>{const r=check(input,s),ok=r.type===expected;ok?pass++:fail++;const row=document.createElement('div');row.className='test-case '+(ok?'pass':'fail');row.innerHTML=`<strong>${ok?'✓':'✗'} ${id}</strong><br>expected: ${expected}<br>got: ${r.type}<div class="test-meta">action: ${r.normalized?.action||'-'} · rule: ${r.ruleId||'-'}</div>`;list.appendChild(row)});summary.hidden=false;summary.className='test-summary '+(fail?'test-fail':'test-pass');summary.textContent=`${fail?'FAIL':'PASS'} — ${pass}/38 passed`}document.getElementById('runRegression').addEventListener('click',runRegression);
</script></body></html>
