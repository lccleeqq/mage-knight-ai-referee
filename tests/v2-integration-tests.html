<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rules Engine v2 Integration Tests</title><style>body{font-family:system-ui,"Microsoft JhengHei",sans-serif;max-width:1000px;margin:30px auto;padding:20px;background:#111827;color:#e5e7eb}section{background:#1e293b;padding:20px;border-radius:16px;margin-bottom:20px}.pass{color:#86efac}.fail{color:#fca5a5}pre{white-space:pre-wrap;line-height:1.5}.meta{color:#94a3b8}</style></head><body><h1>⚖ Rules Engine v2 Integration</h1><section id="summary">Running...</section><section><pre id="details"></pre></section><script src="../engine/rules-v2-adapter.js?v=2.0.2"></script><script>(async()=>{const cases=[
{id:'I-001',input:'我這回合第二次使用已經 Spent 的 Unit。',state:{unitState:'spent'},expected:'violation'},
{id:'I-002',input:'我再次使用這個 Unit。',state:{unitState:'unknown'},expected:'insufficient_information'},
{id:'I-003',input:'我在 Block 階段用 Block 防禦敵人的攻擊。',state:{phase:'Block'},expected:'not_violation'},
{id:'I-004',input:'我用 Block 防禦敵人的攻擊。',state:{phase:'Attack'},expected:'violation'},
{id:'I-005',input:'我用 Block 防禦敵人的攻擊。',state:{phase:'unknown'},expected:'insufficient_information'},
{id:'I-006',input:'Concentration 取得 Mana。',state:{},expected:'not_violation'},
{id:'I-007',input:'我攻擊敵人。',state:{},expected:'insufficient_information'},
{id:'I-008',input:'我在 Night 移動到森林。',state:{time:'Night',terrain:'forest'},expected:'insufficient_information'}
];let p=0,f=0,o=[];for(const c of cases){const r=evaluateStructuredV2(c.input,c.state);const got=r?.type==='error'?'violation':r?.type==='insufficient'?'insufficient_information':r?.type==='ok'?'not_violation':'no_result';const ok=got===c.expected;ok?p++:f++;o.push(`${ok?'✓':'✗'} ${c.id}\n  expected: ${c.expected}\n  got:      ${got}\n  action:   ${r?.normalized?.action||'-'}\n  rule:     ${r?.ruleId||'-'}`)}document.getElementById('summary').innerHTML=`<h2 class="${f?'fail':'pass'}">${f?'FAIL':'PASS'} — ${p}/${cases.length} passed</h2><div class="meta">v2.0.2 — cache-busted integration test.</div>`;document.getElementById('details').textContent=o.join('\n\n')})()</script></body></html>
