<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rules Engine Edge Tests</title><style>body{font-family:system-ui,"Microsoft JhengHei",sans-serif;max-width:1000px;margin:30px auto;padding:20px;background:#111827;color:#e5e7eb}section{background:#1e293b;padding:20px;border-radius:16px;margin-bottom:20px}.pass{color:#86efac}.fail{color:#fca5a5}pre{white-space:pre-wrap;line-height:1.5}.meta{color:#94a3b8}</style></head><body><h1>⚖ Rules Engine Edge Tests v1.1</h1><section id="summary">Running...</section><section><pre id="details"></pre></section><script src="../app.js?v=1.1.1"></script><script>(async()=>{const d=await fetch('./edge-cases-v1.json?v=1.1.1').then(r=>r.json());let p=0,f=0,o=[];for(const c of d.cases){const r=check(c.input,c.state||{unitState:'unknown',phase:'unknown'});const got=r.type==='error'?'violation':r.type==='insufficient'?'insufficient_information':'not_violation';const ok=got===c.expected;ok?p++:f++;o.push(`${ok?'✓':'✗'} ${c.id} ${c.category}\n  expected: ${c.expected}\n  got:      ${got}\n  engine:   ${r.title}`)}document.getElementById('summary').innerHTML=`<h2 class="${f?'fail':'pass'}">${f?'FAIL':'PASS'} — ${p}/${d.cases.length} passed</h2><div class="meta">直接執行目前 app.js 的 check()。</div>`;document.getElementById('details').textContent=o.join('\n\n')})()</script></body></html>
