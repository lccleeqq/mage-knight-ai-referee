<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rules Engine Test Suite</title><style>body{font-family:system-ui,"Microsoft JhengHei",sans-serif;max-width:1000px;margin:30px auto;padding:20px;background:#111827;color:#e5e7eb}section{background:#1e293b;padding:20px;border-radius:16px;margin-bottom:20px}.pass{color:#86efac}.fail{color:#fca5a5}.skip{color:#fde68a}pre{white-space:pre-wrap;line-height:1.5}.meta{color:#94a3b8}</style></head><body><h1>⚖ Rules Engine Test Suite</h1><section id="summary">Running...</section><section><pre id="details"></pre></section><script src="../app.js"></script><script>
(async()=>{const data=await fetch('./rules-engine-tests.json').then(r=>r.json());let pass=0,fail=0;const out=[];for(const c of data.cases){const r=check(c.input,c.state||{unitState:'unknown',phase:'unknown'});let got=r.type==='error'?'violation':r.type==='insufficient'?'insufficient_information':'not_violation';const ok=got===c.expected;if(ok)pass++;else fail++;out.push(`${ok?'✓':'✗'} ${c.id} ${c.category}\n  expected: ${c.expected}\n  got:      ${got}\n  engine:   ${r.title}\n  ${c.reason}`)}document.getElementById('summary').innerHTML=`<h2 class="${fail?'fail':'pass'}">${fail?'FAIL':'PASS'} — ${pass}/${data.cases.length} passed</h2><div class="meta">測試直接呼叫 ../app.js 的 check()；不是另一套模擬判斷。</div>`;document.getElementById('details').textContent=out.join('\n\n')})();
</script></body></html>
