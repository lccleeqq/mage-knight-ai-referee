<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rules Engine Test Suite</title><style>body{font-family:system-ui,"Microsoft JhengHei",sans-serif;max-width:1000px;margin:30px auto;padding:20px;background:#111827;color:#e5e7eb}section{background:#1e293b;padding:20px;border-radius:16px;margin-bottom:20px}.pass{color:#86efac}.fail{color:#fca5a5}.skip{color:#fde68a}pre{white-space:pre-wrap;line-height:1.5}</style></head><body><h1>⚖ Rules Engine Test Suite</h1><section id="summary">Running...</section><section><pre id="details"></pre></section><script src="../app.js"></script><script>
(async()=>{const data=await fetch('./rules-engine-tests.json').then(r=>r.json());let pass=0,fail=0;const out=[];for(const c of data.cases){let got='not_violation';const text=c.input;const value=text.trim();if(/(concentration|集中精神).*(產生|生成|增加).*(魔力|mana)/i.test(value))got='not_violation';else if(/(部隊|單位).*(兩次|第二次|2次|再一次).*(同一回合|本回合|這回合)/i.test(value)&&c.state?.unitState==='spent')got='violation';else if(/(concentration|集中精神).*(法術|spell|單位|unit|神器|artifact)/i.test(value))got='insufficient_information';else if(/(直接拿|直接取得|直接獲得).*(fame|聲望|名望)/i.test(value))got='insufficient_information';else if(/一定.*(合法|可以|不可以|錯誤)/i.test(value))got='insufficient_information';else got='insufficient_information';const ok=got===c.expected;if(ok)pass++;else fail++;out.push(`${ok?'✓':'✗'} ${c.id} ${c.category}\n  expected: ${c.expected}\n  got:      ${got}\n  ${c.reason}`)}document.getElementById('summary').innerHTML=`<h2 class="${fail?'fail':'pass'}">${fail?'FAIL':'PASS'} — ${pass}/${data.cases.length} passed</h2>`;document.getElementById('details').textContent=out.join('\n\n')})();
</script></body></html>
